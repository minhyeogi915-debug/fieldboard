<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIELD BOARD · 수원 블루나이츠 공수 기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#1f3a8a;--ink:#16244a;--muted:#5d6b89;--line:#d5deee;--bg:#e8eef8;--card:#fff;--gold:#d4a64a;--soft:#f2f6fd;--chip:#f4f7fd;--ok:#15803d}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
header.top{background:linear-gradient(100deg,#1e3a8a,#2a48ad);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 22px;gap:14px;flex-wrap:wrap;border-bottom:3px solid var(--gold)}
.brand{display:flex;align-items:center;gap:14px}
.brand .sep{width:1px;height:42px;background:rgba(255,255,255,.3)}
.t1{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:27px;letter-spacing:.5px;line-height:1.1}
.t1 small{font-family:'Noto Sans KR',sans-serif;font-weight:500;font-size:16px;opacity:.92}
.t2{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:2px;font-size:12.5px;opacity:.85}
.hright{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{border:1.5px solid rgba(255,255,255,.55);border-radius:999px;padding:7px 14px;font-size:13px;display:flex;gap:7px;align-items:center;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:#fff}
.hsel{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.55);border-radius:12px;padding:8px 10px;font:inherit;font-size:14px;max-width:230px}
.hsel option{color:#000}
.hbtn{background:#2f55c9;color:#fff;border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:700;font-size:14px}
.useg{display:flex;background:rgba(255,255,255,.14);border-radius:12px;padding:3px}
.useg button{border:0;background:transparent;color:#fff;font:inherit;font-weight:800;padding:7px 18px;border-radius:9px;font-size:14px}
.useg button.on{background:#fff;color:var(--navy)}
nav.tabs{background:#f7f9fd;border-bottom:1px solid var(--line);display:flex;gap:4px;padding:10px 18px;overflow-x:auto}
nav.tabs button{border:0;background:transparent;font:inherit;font-weight:700;font-size:15px;color:var(--ink);padding:10px 16px;border-radius:12px;white-space:nowrap}
nav.tabs button.on{background:var(--navy);color:#fff;box-shadow:inset 0 -3px 0 var(--gold)}
main{padding:18px 22px 120px;max-width:1500px;margin:0 auto}
.kick{font-family:'Barlow Condensed',sans-serif;font-weight:800;letter-spacing:1.6px;color:var(--navy);font-size:14px;display:flex;align-items:center;gap:8px}
.kick:before{content:'';width:5px;height:13px;background:var(--gold);transform:skewX(-20deg);display:inline-block}
h1{margin:4px 0 4px;font-size:30px;font-weight:900;letter-spacing:-.5px}
.sub{color:var(--muted);font-size:14px}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 2px 10px rgba(31,58,138,.05);min-width:0}
.card h3{margin:0 0 12px;font-size:18px;font-weight:800}
h3.bar{border-left:4px solid var(--navy);padding-left:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.rec{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
@media(max-width:1050px){.rec{grid-template-columns:1fr}}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.btn{border:1.5px solid var(--line);background:#fff;color:var(--navy);font:inherit;font-weight:700;font-size:14px;padding:9px 14px;border-radius:12px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.warn{background:#fdf3dc;border-color:#e9c77a;color:#6b4a07}
.btn.danger{color:#b91c1c;border-color:#f3c3c3}
.btn.big{padding:14px 22px;font-size:16px}
.btn.on{background:var(--navy);color:#fff;border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.badge{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;background:var(--soft);color:var(--ink);white-space:nowrap}
.badge.g{background:#e7f6ec;border-color:#bfe3cb;color:#166534}
.badge.o{background:#fff4e0;border-color:#f1d29a;color:#8a5a00}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-width:70px;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--chip);font:inherit;font-weight:700;font-size:16px;color:var(--ink)}
.chip.sm{min-width:0;padding:9px 12px;font-size:14px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.lbl{font-weight:700;font-size:14px;color:#33415f;margin:0 0 8px}
.irow{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-end}
.step{display:flex;gap:6px;align-items:stretch}
.step button{min-width:52px;border:1.5px solid #c9d6ef;background:#eef3fc;border-radius:14px;font:inherit;font-weight:800;font-size:18px;color:var(--navy)}
.step input{width:96px;text-align:center;font:inherit;font-weight:900;font-size:26px;border:1.5px solid var(--line);border-radius:14px;padding:8px;color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.tile{border:1.5px solid var(--line);border-radius:14px;padding:10px;min-height:86px;background:#fff;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:3px;cursor:pointer}
.tile.empty{border-style:dashed;color:#a9b4c9;background:#fbfcfe}
.tile .pos{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.5px}
.tile .nm{font-weight:800;font-size:15px}
.tile.has{border-color:var(--gold);background:#fffaf0}
.mini{display:inline-block;background:var(--navy);color:#fff;border-radius:6px;font-size:11px;padding:2px 6px;margin:1px}
.note{background:#eef3fc;border-left:4px solid var(--navy);border-radius:10px;padding:12px 14px;font-size:14px;color:#33415f;line-height:1.5}
.note.warn{background:#fff6e6;border-color:var(--gold)}
.note.bad{background:#fdecec;border-color:#dc2626}
.note.good{background:#e9f7ee;border-color:#16a34a}
details summary{cursor:pointer;font-weight:800;padding:12px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px;border-bottom:1px solid #e6ecf6;text-align:left;white-space:nowrap}
th{background:#f4f7fd;font-weight:800}
.tbl{border:1px solid var(--line);border-radius:14px;overflow:auto}
.stat{background:#f5f8fe;border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.stat .k{color:var(--muted);font-size:14px}
.stat .v{font-size:34px;font-weight:900;color:var(--navy);margin-top:6px}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
@media(max-width:820px){.stats4{grid-template-columns:repeat(2,1fr)}}
.fbar{position:fixed;right:20px;bottom:20px;background:var(--navy);color:#fff;border-radius:20px;padding:10px 10px 10px 22px;display:flex;align-items:center;gap:16px;box-shadow:0 10px 30px rgba(15,30,80,.35);border:2px solid var(--gold);z-index:30}
.fbar button{background:#2b4bb0;border:2px solid rgba(255,255,255,.35);color:#fff;font:inherit;font-weight:900;font-size:19px;padding:12px 22px;border-radius:14px}
svg.field{width:100%;height:auto;border-radius:16px;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.toolbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input.txt,select.txt,textarea.txt{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;background:#fff;color:var(--ink);min-width:0}
.preg{display:grid;grid-template-columns:90px minmax(0,1fr) 170px;gap:8px}
@media(max-width:640px){.preg{grid-template-columns:80px minmax(0,1fr)}.preg .pp{grid-column:1/-1}}
.plist{display:grid;gap:8px}
.prow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff}
.prow .pn{flex:1;min-width:140px}
.prow .pn b{font-size:16px}
select.txt.inl{width:auto}
textarea.txt{min-height:90px;resize:vertical}
.form{display:grid;gap:12px}
.form label{font-size:13px;font-weight:700;color:#33415f;display:grid;gap:6px}
label.ck{display:flex!important;gap:10px;align-items:center;font-size:15px!important}
label.ck input{width:20px;height:20px}
.mback{position:fixed;inset:0;background:rgba(10,20,50,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:22px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{max-width:820px}
.modal h2{margin:0 0 14px;font-size:20px}
.mact{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#16244a;color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.bench{display:flex;flex-wrap:wrap;gap:8px}
.hist{font-size:13px;color:#33415f;display:grid;gap:6px;max-height:240px;overflow:auto}
.hist div{background:#f5f8fe;border-radius:10px;padding:8px 10px}
.muted{color:var(--muted)}
.sm{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pk{border:1.5px solid var(--line);border-radius:12px;padding:10px;background:#fff;font:inherit;text-align:left;color:var(--ink)}
.pk.match{border-color:var(--navy);background:#eef3fc}
.pk b{display:block}
.good{color:var(--ok)} .bad{color:#b91c1c}
.sitbig{font-size:26px;font-weight:900}
.sitbig span{color:var(--muted);font-weight:500}
.livebox{display:grid;gap:8px}
hr.d{border:0;border-top:1px solid var(--line);margin:18px 0}
</style>
</head>
<body>
<header class="top" id="hdr"></header>
<nav class="tabs" id="tabs"></nav>
<main id="view"></main>
<div id="fbar"></div>
<div id="modalRoot"></div>
<div id="toast"></div>
<script>
/* ================= 기본 유틸 ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const clone=o=>JSON.parse(JSON.stringify(o));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const f1=x=>x==null||isNaN(x)?'—':(Math.round(x*10)/10).toFixed(1);
const pct=(a,b)=>b?Math.round(a/b*100)+'%':'—';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const hm=ts=>{const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};

/* ================= 설정 ================= */
const UNITS={
 D:{name:'수비',en:'DEFENSE',yardLbl:'허용 야드 · 음수 가능',dirLbl:'상대 공격 방향 (수비 시점)',avgLbl:'평균 허용',
  passLbl:'상대 패스 결과',coverLbl:'커버리지',
  stats:['태클','어시스트','TFL','색','QB 압박','PBU','INT','FF','FR','TD','미스 태클','커버 실수','페널티'],
  ends:['펀트 유도','인터셉션','펌블 리커버','다운 턴오버','터치다운 허용','필드골 허용','필드골 실패 유도','세이프티','전반/경기 종료','기타'],
  covers:['Cover 0','Cover 1','Cover 2','Cover 3','Cover 4','Cover 6','2-Man','기타'],defForm:'43over',defCover:'Cover 3'},
 O:{name:'공격',en:'OFFENSE',yardLbl:'전진 야드 · 음수 가능',dirLbl:'공격 방향 (공격 시점)',avgLbl:'평균 전진',
  passLbl:'패스 결과',coverLbl:'공격 컨셉',
  stats:['캐리','타겟','캐치','드롭','TD','퍼스트다운','펌블 로스트','블록 실패','색 허용','페널티'],
  ends:['터치다운','필드골 성공','필드골 실패','펀트','인터셉션','펌블 로스트','다운 턴오버','세이프티','전반/경기 종료','기타'],
  covers:['런 위주','패스 위주','RPO','플레이액션','스크린','옵션','2분 공격','기타'],defForm:'gun22',defCover:'RPO'}
};
const OL=[[76,28],[88,28],[100,28],[112,28],[124,28]], OLL=['LT','LG','C','RG','RT'];
const FORMS={
 D:{
  '43over':{name:'4-3 Over',L:['DE','DT','DT','DE','WILL','MIKE','SAM','CB','SS','FS','CB'],P:[[44,92],[84,93],[110,93],[142,92],[74,70],[100,70],[126,70],[30,44],[154,55],[100,22],[172,44]]},
  '43under':{name:'4-3 Under',L:['DE','DT','DT','DE','WILL','MIKE','SAM','CB','SS','FS','CB'],P:[[48,92],[80,93],[112,93],[140,92],[70,70],[102,70],[162,90],[28,44],[146,55],[100,22],[174,44]]},
  '34':{name:'3-4',L:['DE','NT','DE','OLB','ILB','ILB','OLB','CB','SS','FS','CB'],P:[[64,93],[100,93],[136,93],[32,88],[84,70],[116,70],[168,88],[22,44],[150,55],[100,22],[178,44]]},
  '425':{name:'Nickel 4-2-5',L:['DE','DT','DT','DE','WILL','MIKE','NB','CB','SS','FS','CB'],P:[[48,92],[86,93],[114,93],[152,92],[84,70],[116,70],[156,62],[24,44],[128,38],[76,22],[176,44]]},
  '335':{name:'3-3-5 Stack',L:['DE','NT','DE','WILL','MIKE','SAM','NB','CB','SS','FS','CB'],P:[[64,93],[100,93],[136,93],[64,72],[100,72],[136,72],[162,62],[22,44],[146,38],[60,26],[178,44]]}
 },
 O:{
  'gun22':{name:'Shotgun 2x2',L:[...OLL,'QB','RB','X','SL','SL','Z'],P:[...OL,[100,58],[116,60],[14,24],[44,32],[156,32],[186,24]]},
  'gun31':{name:'Shotgun Trips',L:[...OLL,'QB','RB','X','SL','SL','Z'],P:[...OL,[100,58],[84,60],[14,24],[146,32],[166,42],[186,24]]},
  'iform':{name:'I-Form',L:[...OLL,'QB','FB','RB','TE','X','Z'],P:[...OL,[100,42],[100,64],[100,86],[138,30],[14,24],[176,32]]},
  'single':{name:'Singleback',L:[...OLL,'QB','RB','TE','X','SL','Z'],P:[...OL,[100,42],[100,72],[138,30],[14,24],[160,32],[186,24]]},
  'pistol':{name:'Pistol',L:[...OLL,'QB','RB','TE','X','SL','Z'],P:[...OL,[100,52],[100,78],[138,30],[14,24],[40,32],[186,24]]}
 }
};
const ALIAS={DL:['DE','DT','NT'],DT:['DT','NT'],LB:['WILL','MIKE','SAM','OLB','ILB'],OLB:['OLB','WILL','SAM'],ILB:['ILB','MIKE','WILL'],
 S:['SS','FS'],DB:['CB','SS','FS','NB'],CB:['CB','NB'],NB:['NB'],OL:['LT','LG','C','RG','RT'],OT:['LT','RT'],T:['LT','RT'],OG:['LG','RG'],G:['LG','RG'],
 WR:['X','Z','SL'],SLOT:['SL'],HB:['RB'],TB:['RB'],RB:['RB','FB']};
function posMatch(label,posStr){
 const toks=String(posStr||'').toUpperCase().split(/[\/,\s·]+/).filter(Boolean);
 return toks.some(t=>t===label||(ALIAS[t]||[]).includes(label))?1:0;
}

/* ================= 저장소 ================= */
const KEY='suwon-bk-fieldboard-v1';
let storeOK=true;
function load(){try{localStorage.setItem(KEY+'-t','1');localStorage.removeItem(KEY+'-t');const t=localStorage.getItem(KEY);return t?JSON.parse(t):null}catch(e){storeOK=false;return null}}
let DB=load()||{v:1,players:[],sessions:[],currentId:null,lastBackup:null};
let saveT;
function save(){if(UI.viewer)return;clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(DB));storeOK=true}catch(e){storeOK=false}updatePill()},120);schedulePush()}
function updatePill(){const p=$('#pill');if(!p)return;
 if(UI.viewer)p.innerHTML=SYNC.err?`<span class=dot style="background:#f87171"></span>연결 확인 필요`:`<span class=dot style="background:#4ade80"></span>실시간 보기${SYNC.shared.updated?' · '+hms(SYNC.shared.updated):''}`;
 else if(SYNC.on&&SYNC.db)p.innerHTML=SYNC.err?`<span class=dot style="background:#f87171"></span>공유 오류`:`<span class=dot style="background:#4ade80"></span>실시간 공유 중${SYNC.lastPush?' · '+hms(SYNC.lastPush):''}`;
 else p.innerHTML=storeOK?'<span class=dot></span>기기 내부 저장':'<span class=dot style="background:#f87171"></span>임시 저장 · 백업 필수';
 const st=$('#syncStatus');if(st&&UI.tab==='settings')st.innerHTML=syncStatusHTML();
}
const hms=ts=>{const d=new Date(ts);return [d.getHours(),d.getMinutes(),d.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':')};

/* ================= 실시간 공유 (서버비 없이 claude.ai 아티팩트 저장소 사용) ================= */
const SYNC={db:null,user:null,canWrite:null,connected:false,on:false,shared:{players:[],sessions:{},live:null,updated:null},hashes:{},busy:false,again:false,err:'',lastPush:0};
try{SYNC.on=localStorage.getItem(KEY+'-share')==='on'}catch(e){}
let LOCAL=null;
function initSync(n=0){
 if(!(window.claude&&typeof window.claude.use==='function')){if(n<25)setTimeout(()=>initSync(n+1),300);return}
 Promise.all([window.claude.use('db'),window.claude.use('user')]).then(async([db,user])=>{
  SYNC.user=user;if(!db){refreshSyncUI();return}
  SYNC.db=db;
  try{SYNC.canWrite=user?await user.can('data.write'):null}catch(e){SYNC.canWrite=null}
  const t=setTimeout(()=>{if(!SYNC.connected){SYNC.err='공유 저장소에 아직 연결되지 않았어요 (네트워크 확인)';refreshSyncUI()}},10000);
  const ok=()=>{if(!SYNC.connected){SYNC.connected=true;clearTimeout(t);if(SYNC.err.startsWith('공유 저장소'))SYNC.err=''}};
  db.collection('sessions').onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{const x=d.data();if(x&&typeof x.json==='string'){try{m[d.id]=JSON.parse(x.json)}catch(e){}}});SYNC.shared.sessions=m;SYNC.shared.updated=Date.now();if(!snap.metadata.fromCache)ok();onShared()},e=>{clearTimeout(t);SYNC.err='공유 연결 오류 ('+(e&&e.code)+')';refreshSyncUI()});
  db.doc('meta/roster').onSnapshot(s=>{let pl=[];if(s.exists){try{pl=JSON.parse(s.data().json)}catch(e){}}SYNC.shared.players=Array.isArray(pl)?pl:[];onShared()},()=>{});
  db.doc('meta/live').onSnapshot(s=>{SYNC.shared.live=s.exists?s.data():null;onShared()},()=>{});
  if(SYNC.on)schedulePush();
  refreshSyncUI();
 }).catch(()=>{});
}
function refreshSyncUI(){renderHeader();if(UI.tab==='settings'&&!$('#modalRoot').innerHTML)renderView()}
function onShared(){
 if(UI.viewer){buildViewerDB();if($('#modalRoot').innerHTML)renderHeader();else render()}
 else updatePill();
}
function buildViewerDB(){
 const sh=SYNC.shared;const sessions=Object.values(sh.sessions).sort((a,b)=>(a.created||0)-(b.created||0));
 let cid=DB&&DB.currentId;
 if(UI.followLive&&sh.live&&sh.live.sid&&sessions.find(s=>s.id===sh.live.sid))cid=sh.live.sid;
 if(!sessions.find(s=>s.id===cid))cid=sessions.length?sessions[sessions.length-1].id:null;
 DB={v:1,players:sh.players.slice(),sessions,currentId:cid,lastBackup:null};
}
let pushT;
function schedulePush(){if(!SYNC.on||!SYNC.db||UI.viewer)return;clearTimeout(pushT);pushT=setTimeout(()=>pushNow(false),1000)}
async function pushNow(all){
 if(!SYNC.db||UI.viewer)return;
 if(SYNC.busy){SYNC.again=true;return}SYNC.busy=true;let err='';
 try{
  const db=SYNC.db;
  const rj=JSON.stringify(DB.players);if(SYNC.hashes.roster!==rj){await db.doc('meta/roster').set({json:rj,updated:Date.now()});SYNC.hashes.roster=rj}
  const list=all?DB.sessions.slice():[cur()].filter(Boolean);
  for(const s of list){const j=JSON.stringify(s);if(SYNC.hashes['s_'+s.id]===j)continue;
   if(j.length>240000){err=`"${s.name}" 기록이 너무 커서(${Math.round(j.length/1024)}KB) 공유하지 못했어요. 작전판 필기를 지우거나 기록을 나눠 주세요.`;continue}
   await db.doc('sessions/'+s.id).set({json:j,name:s.name,date:s.date,updated:Date.now()});SYNC.hashes['s_'+s.id]=j}
  const c=cur();if(c&&SYNC.hashes.live!==c.id){await db.doc('meta/live').set({sid:c.id,updated:Date.now()});SYNC.hashes.live=c.id}
  SYNC.lastPush=Date.now();
 }catch(e){const code=e&&e.code;
  err=code==='invalid_argument'?'이 계정은 공유 기록을 쓸 권한이 없어요 (보기 전용). 소유자나 편집자만 기록을 올릴 수 있어요.':code==='quota_exceeded'?'공유 저장 공간이 가득 찼어요. 오래된 공유 기록을 지워 주세요.':'업로드 실패 — 잠시 후 자동으로 다시 시도합니다';
  if(code!=='invalid_argument'&&code!=='quota_exceeded'){SYNC.hashes={};setTimeout(schedulePush,5000)}}
 SYNC.err=err;SYNC.busy=false;updatePill();
 if(SYNC.again){SYNC.again=false;pushNow(false)}
}

 const parts=[];
 if(UI.viewer)parts.push(`<div class="note good">지금 <b>실시간 보기</b> 중 · 마지막 수신 ${SYNC.shared.updated?hms(SYNC.shared.updated):'—'} · 공유된 기록 ${Object.keys(SYNC.shared.sessions).length}개</div>`);
 else if(SYNC.on)parts.push(`<div class="note good">이 기기가 <b>기록 기기</b>로 공유 중 · 마지막 업로드 ${SYNC.lastPush?hms(SYNC.lastPush):'아직 없음'}</div>`);

function snapRows(unitSnaps,max,del){
 return unitSnaps.slice().reverse().slice(0,max).map(x=>{const n=unitSnaps.indexOf(x)+1;const flags=[x.noPlay?'노플레이':'',x.pen?`페널티 ${x.pen.side==='수비팀'?'+':'-'}${x.pen.yds}`:'',x.passRes||'',x.td?'TD':'',x.review?'확인 필요':'',x.stats.length?x.stats.map(t=>pname(t.pid).replace(/^#\S+ /,'')+' '+t.s).join(', '):''].filter(Boolean).join(' · ');
  return `<tr><td>${n}</td><td>#${x.driveNo}</td><td>${x.q}</td><td>${x.down}&${x.dist}</td><td>${x.play}</td><td>${x.dir}</td><td><b>${x.noPlay?'—':x.yards}</b></td><td class=sm style="white-space:normal">${esc(flags)||'—'}</td>${del?`<td><button class="btn danger" style="padding:5px 9px" data-act=delSnap data-id=${x.id}>삭제</button></td>`:''}</tr>`}).join('');
}

  ${u.memo||u.note?`<div class=card><h3>전술 · 코치 메모</h3>${u.memo?`<p style="white-space:pre-wrap">${esc(u.memo)}</p>`:''}${u.note?`<p style="white-space:pre-wrap" class=muted>${esc(u.note)}</p>`:''}</div>`:''}

function liveCheck(s,k){
 const u=s.units[k],D=k==='D';
 const v=s.snaps.filter(x=>x.unit===k&&!x.noPlay);
 const ds=v.filter(x=>x.driveNo===u.driveNo);
 const avg=a=>a.length?a.reduce((t,x)=>t+x.yards,0)/a.length:null;
 const items=[];
 items.push(`<div class=note>이번 드라이브 <b>${ds.length}스냅 · ${ds.reduce((t,x)=>t+x.yards,0)}야드</b>${ds.length?` · 평균 ${f1(avg(ds))}yd`:''}</div>`);
 if(v.length<5){items.push(`<div class=note>ⓘ 분석 가능한 ${UNITS[k].name} 스냅 ${v.length}회. 표본이 적어 ${D?'취약 지점':'강·약점'}을 단정하기 어렵습니다.</div>`)}
 else{
  const last5=v.slice(-5);items.push(`<div class=note>최근 5스냅 평균 <b>${f1(avg(last5))}yd</b> · 전체 평균 ${f1(avg(v))}yd (n=${v.length})</div>`);
  const l3=v.slice(-3);if(l3.length===3&&l3.every(x=>x.dir===l3[0].dir&&x.dir!=='미확인')){const a=avg(l3);items.push(`<div class="note ${D?(a>=4?'bad':'warn'):(a>=4?'good':'warn')}">최근 3스냅 모두 <b>${l3[0].dir}</b> · 평균 ${f1(a)}yd${D?' — 같은 방향 반복 공략 중':''}</div>`)}
  const dir=['왼쪽','중앙','오른쪽'].map(d=>{const a=v.filter(x=>x.dir===d);return `${d} ${a.length}회 ${f1(avg(a))}yd`}).join(' · ');
  items.push(`<div class="note sm">${dir}</div>`);
 }
 const big=v.filter(x=>x.yards>=15).length;if(big)items.push(`<div class="note ${D?'bad':'good'}">15야드+ ${D?'허용':'플레이'} ${big}회</div>`);
 const rv=s.snaps.filter(x=>x.unit===k&&x.review).length;if(rv)items.push(`<div class="note warn">확인 필요 표시 ${rv}스냅</div>`);
 return `<div class=livebox>${items.join('')}</div>`;
}

function svgPt(svg,e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const r=pt.matrixTransform(svg.getScreenCTM().inverse());return[Math.round(r.x*10)/10,Math.round(r.y*10)/10]}
function bindBoard(){
 const svg=$('#bfield');if(!svg||UI.viewer)return;const B=UI.board,k=UI.unit;
 let drag=null,drawing=null,erasing=false;
 const redraw=()=>{svg.innerHTML=fieldSVG(B.draft,k)};
 const eraseAt=pt=>{const n=B.draft.strokes.length;B.draft.strokes=B.draft.strokes.filter(s=>!s.some(p=>Math.hypot(p[0]-pt[0],p[1]-pt[1])<4));if(n!==B.draft.strokes.length)redraw()};
 svg.addEventListener('pointerdown',e=>{
  const pt=svgPt(svg,e);const g=e.target.closest('.pl');const i=g?+g.dataset.slot:-1;
  if(B.mode==='swap'){if(i>=0)pickModal(i,'draft');return}
  e.preventDefault();
  if(B.mode==='move'){if(i<0)return;pushUndo();drag=i;svg.setPointerCapture(e.pointerId);return}
  if(B.mode==='pen'){pushUndo();drawing=[pt];B.draft.strokes.push(drawing);svg.setPointerCapture(e.pointerId);redraw();return}
  if(B.mode==='erase'){pushUndo();erasing=true;svg.setPointerCapture(e.pointerId);eraseAt(pt)}
 });
 svg.addEventListener('pointermove',e=>{
  if(drag==null&&!drawing&&!erasing)return;const pt=svgPt(svg,e);
  if(drag!=null){B.draft.slots[drag]=[clamp(pt[0],7,193),clamp(pt[1],7,113)];redraw()}
  else if(drawing){const l=drawing[drawing.length-1];if(Math.hypot(pt[0]-l[0],pt[1]-l[1])>1.2){drawing.push(pt);redraw()}}
  else eraseAt(pt);
 });
 const end=()=>{if(drag!=null||drawing||erasing){drag=null;drawing=null;erasing=false;renderView()}};
 svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
}

function analyze(s,k){
 const all=s.snaps.filter(x=>x.unit===k),v=all.filter(x=>!x.noPlay);
 const avg=a=>a.length?a.reduce((t,x)=>t+x.yards,0)/a.length:null;
 const run=v.filter(x=>x.play==='런'),pass=v.filter(x=>x.play==='패스');
 const dirs=['왼쪽','중앙','오른쪽'].map(d=>{const a=v.filter(x=>x.dir===d);return{d,n:a.length,avg:avg(a),five:a.filter(x=>x.yards>=5).length,runN:a.filter(x=>x.play==='런').length,run:avg(a.filter(x=>x.play==='런')),passN:a.filter(x=>x.play==='패스').length,pass:avg(a.filter(x=>x.play==='패스'))}});
 const third=v.filter(x=>x.down===3&&!x.pen);const conv=third.filter(x=>x.yards>=x.dist||x.td).length;
 const fourth=v.filter(x=>x.down===4&&!x.pen);const conv4=fourth.filter(x=>x.yards>=x.dist||x.td).length;
 const rz=v.filter(x=>x.ytg!=null&&x.ytg<=20);
 const passK=pass.filter(x=>x.passRes);const comp=passK.filter(x=>x.passRes==='성공').length;
 const downs=[1,2,3,4].map(d=>{const a=v.filter(x=>x.down===d);return{d,n:a.length,avg:avg(a)}});
 const forms={};v.forEach(x=>{(forms[x.form]=forms[x.form]||[]).push(x)});
 const qs={};v.forEach(x=>{(qs[x.q]=qs[x.q]||[]).push(x)});
 const drives=s.drives.filter(d=>d.unit===k).sort((a,b)=>a.no-b.no).map(d=>{const a=all.filter(x=>x.driveNo===d.no);return{no:d.no,n:a.length,yds:a.filter(x=>!x.noPlay).reduce((t,x)=>t+x.yards,0),res:d.result||(d.no===s.units[k].driveNo?'진행 중':'—')}});
 const statCount={};all.forEach(x=>x.stats.forEach(t=>{statCount[t.s]=(statCount[t.s]||0)+1}));
 const pl={};const get=id=>pl[id]=pl[id]||{snaps:0,c:{},rush:0,rec:0,att:0,comp:0,pyds:0,int:0,sack:0};
 all.forEach(x=>{x.lineup.forEach(id=>{if(id)get(id).snaps++});
  x.stats.forEach(t=>{const r=get(t.pid);r.c[t.s]=(r.c[t.s]||0)+1;if(!x.noPlay){if(t.s==='캐리')r.rush+=x.yards;if(t.s==='캐치')r.rec+=x.yards}});
  if(k==='O'&&x.play==='패스'&&x.passRes&&!x.noPlay&&x.lineup[5]){const r=get(x.lineup[5]);if(x.passRes!=='색'){r.att++;if(x.passRes==='성공'){r.comp++;r.pyds+=x.yards}if(x.passRes==='INT')r.int++}else r.sack++}});
 return{all,v,n:v.length,avg:avg(v),run:avg(run),runN:run.length,pass:avg(pass),passN:pass.length,dirs,thirdN:third.length,conv,fourthN:fourth.length,conv4,
  rzN:rz.length,rzAvg:avg(rz),rzTD:rz.filter(x=>x.td).length,passKN:passK.length,comp,big:v.filter(x=>x.yards>=15),neg:v.filter(x=>x.yards<0).length,downs,forms,qs,drives,statCount,pl,
  unknownDir:v.filter(x=>x.dir==='미확인').length,unknownPlay:v.filter(x=>x.play==='미확인').length,review:all.filter(x=>x.review).length,pens:all.filter(x=>x.pen).length,td:v.filter(x=>x.td).length}
}

  else{const dr=A.statCount['드롭']||0,bf=A.statCount['블록 실패']||0;if(dr>=2)out.push(['warn',`드롭 ${dr}회.`]);if(bf>=2)out.push(['warn',`블록 실패 ${bf}회.`]);if(A.neg>=3)out.push(['bad',`마이너스 야드 플레이 ${A.neg}회.`])}

  if(A.review)out.push(['warn',`'확인 필요' 표시 스냅 ${A.review}회.`]);

function aiPrompt(s,k){
 const U=UNITS[k],u=s.units[k],A=analyze(s,k),D=k==='D';
 const L=[];
 L.push(`너는 미식축구 ${U.name} 코치를 돕는 분석 보조야. 아래는 수원 블루나이츠 "${s.name}" (${s.type}, ${s.date}${s.opp?', 상대 '+s.opp:''})의 ${U.name} 기록이야.`);
 L.push(`현재 전술: ${formLabel(u,k)} · Strong ${u.strong}`);
 if(u.memo)L.push(`전술 운영 목적/감수 위험: ${u.memo}`);
 if(u.note)L.push(`코치 메모: ${u.note}`);
 L.push('','[요약]');
 L.push(`${U.name} 스냅 ${A.n}회 · ${U.avgLbl} ${f1(A.avg)}yd · 런 ${A.runN}회 평균 ${f1(A.run)}yd · 패스 ${A.passN}회 평균 ${f1(A.pass)}yd`);
 L.push('방향별: '+A.dirs.map(x=>`${x.d} ${x.n}회 평균 ${f1(x.avg)}yd (5yd+ ${x.five})`).join(' / ')+` / 방향 미확인 ${A.unknownDir}회`);
 L.push(`3다운: ${A.thirdN}회 중 ${A.conv}회 전환 · 레드존 ${A.rzN}스냅 평균 ${f1(A.rzAvg)}yd · 15yd+ ${A.big.length}회 · 페널티 ${A.pens}스냅`);
 L.push('드라이브: '+(A.drives.map(x=>`#${x.no} ${x.n}스냅 ${x.yds}yd → ${x.res}`).join(' / ')||'없음'));
 const sc=Object.entries(A.statCount).map(([a,b])=>`${a} ${b}`).join(', ');if(sc)L.push('기록된 스탯 합계: '+sc);
 L.push('','[스냅 기록 CSV]',csvText(s,k,true));
 L.push('',`[요청]`,D?`1) 상대 공격의 경향(방향·플레이 종류·다운별)을 정리해줘. 2) 우리 수비의 취약 지점과 그 근거를 말해줘. 3) 다음 드라이브/후반에 바꿀 수 있는 배치·커버리지 조정을 2~3개 제안해줘.`:`1) 우리 공격에서 효율이 좋은/나쁜 플레이·방향을 정리해줘. 2) 다운·거리별 플레이콜 경향과 문제점을 말해줘. 3) 다음 드라이브/후반 플레이콜 조정안을 2~3개 제안해줘.`,`표본이 적은 항목은 단정하지 말고 표본 수를 함께 적어줘. '미확인' 값은 추정하지 마.`);
 return L.join('\n');
}
function csvText(s,k,compact){
 const q=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
 const head=['유닛','스냅#','드라이브','쿼터','다운','거리','엔드존까지','플레이','방향','야드','패스결과','페널티','노플레이','확인필요','TD','전술','선수스탯'];
 const rows=[head.join(',')];let n=0;
 s.snaps.filter(x=>!k||x.unit===k).forEach(x=>{n++;rows.push([UNITS[x.unit].name,n,x.driveNo,x.q,x.down,x.dist,x.ytg??'',x.play,x.dir,x.noPlay?'':x.yards,x.passRes||'',x.pen?`${x.pen.side} ${x.pen.yds}yd${x.pen.auto?' 자동1st':''}`:'',x.noPlay?'Y':'',x.review?'Y':'',x.td?'Y':'',x.form,x.stats.map(t=>`${pname(t.pid)}:${t.s}`).join(' / ')].map(q).join(','))});
 if(compact&&rows.length>201)return rows[0]+'\n...(앞부분 생략)\n'+rows.slice(-200).join('\n');
 return rows.join('\n');
}

 const k=UI.unit,u=cur().units[k],sit=u.sit;
 let side='미확인',yl='';if(sit.ytg!=null){if(sit.ytg===50){side='우리';yl=50}else{const ourSide=k==='D'?sit.ytg<50:sit.ytg>50;side=ourSide?'우리':'상대';yl=ourSide?(k==='D'?sit.ytg:100-sit.ytg):(k==='D'?100-sit.ytg:sit.ytg)}}
 openModal({title:'다운 · 위치 수정',body:`<div class=form>
  <div><div class=lbl>다운</div><div class=chips id=sdDown data-val=${sit.down}>${[1,2,3,4].map(d=>`<button class="chip ${sit.down===d?'on':''}" data-act=sitDown data-v=${d}>${d}</button>`).join('')}</div></div>
  <label>남은 거리 (야드)<input class=txt type=number inputmode=numeric id=sdDist value="${sit.dist}"></label>
  <div class=grid2><label>볼 위치 진영<select class=txt id=sdSide>${['우리','상대','미확인'].map(x=>`<option ${side===x?'selected':''}>${x}</option>`).join('')}</select></label><label>야드 라인 (1~50)<input class=txt type=number inputmode=numeric id=sdYl value="${yl}"></label></div>
  <p class="sm muted">볼 위치를 넣으면 레드존 집계와 Goal to go, 터치다운 감지가 자동으로 됩니다.</p></div>`,
  actions:[{label:'취소'},{label:'적용',cls:'pri',fn:()=>{
   const down=+$('#sdDown').dataset.val||1,dist=Math.max(1,+$('#sdDist').value||10),sd=$('#sdSide').value,y=clamp(+$('#sdYl').value||0,0,50);
   let ytg=null;if(sd!=='미확인'&&y>0){const our=sd==='우리';ytg=k==='D'?(our?y:100-y):(our?100-y:y)}
   u.sit={q:sit.q,down,dist,ytg};save();setTimeout(render,0)}}]});
}
function saveSnap(){
 const s=cur();if(!s)return toast('먼저 새 기록을 만들어 주세요');
 const k=UI.unit,u=s.units[k],f=UI.form,sit=u.sit;
 const yards=Math.round(+f.yards||0);
 const pen=f.pen.on?{side:f.pen.side,yds:Math.abs(+f.pen.yds||0),auto:!!f.pen.auto}:null;
 const penGain=pen?(pen.side==='수비팀'?pen.yds:-pen.yds):0;
 const net=(f.noPlay?0:yards)+penGain;
 let ytg2=sit.ytg==null?null:sit.ytg-net;
 const td=ytg2!=null&&ytg2<=0&&!f.noPlay;
 let down,dist,fd=false;
 if(f.ovr.on){down=+f.ovr.down;dist=Math.max(1,+f.ovr.dist||10)}
 else if(pen&&pen.auto){down=1;dist=10;fd=true}
 else{const d2=sit.dist-net;if(d2<=0){down=1;dist=10;fd=true}else if(f.noPlay){down=sit.down;dist=d2}else{down=sit.down+1;dist=d2}}
 if(ytg2!=null){ytg2=clamp(ytg2,0,99);if(down===1&&ytg2>0&&ytg2<10&&!f.ovr.on)dist=ytg2}
 const stats=[];Object.entries(UI.pending).forEach(([pid,a])=>a.forEach(st=>stats.push({pid,s:st})));
 const snap={id:uid(),unit:k,driveNo:u.driveNo,q:sit.q,down:sit.down,dist:sit.dist,ytg:sit.ytg,play:f.play,dir:f.dir,yards:f.noPlay?0:yards,
  passRes:f.play==='패스'?f.passRes:null,pen,noPlay:f.noPlay,review:f.review,stats,lineup:u.lineup.slice(),form:formLabel(u,k),fd:fd&&!f.noPlay,td,ts:Date.now()};
 if(!s.drives.find(d=>d.unit===k&&d.no===u.driveNo))s.drives.push({id:uid(),unit:k,no:u.driveNo,result:null});
 s.snaps.push(snap);
 u.sit={q:sit.q,down:Math.min(down,4),dist,ytg:td?null:ytg2};
 resetForm();save();render();
 const has=x=>stats.some(t=>t.s===x);let sug=null;
 if(td)sug=k==='D'?'터치다운 허용':'터치다운';
 else if(snap.passRes==='INT'||has('INT'))sug='인터셉션';
 else if(k==='D'&&has('FR'))sug='펌블 리커버';
 else if(k==='O'&&has('펌블 로스트'))sug='펌블 로스트';
 else if(down>4)sug='다운 턴오버';
 if(sug)setTimeout(()=>endDriveModal(sug),150);
 else toast(`저장 · 다음 ${sitText(u.sit)}${fd&&!f.ovr.on?' (퍼스트다운)':''}`);
}
function undoLast(){
 const s=cur(),k=UI.unit,u=s.units[k];const list=s.snaps.filter(x=>x.unit===k);const last=list[list.length-1];if(!last)return;
 confirmBox(`마지막 ${UNITS[k].name} 스냅(#${list.length}, ${last.play} ${last.dir} ${last.yards}yd)을 취소할까요? 다운·위치가 그 스냅 이전으로 돌아갑니다.`,()=>{
  s.snaps=s.snaps.filter(x=>x.id!==last.id);
  if(u.driveNo!==last.driveNo){s.drives=s.drives.filter(d=>!(d.unit===k&&d.no>last.driveNo));const dr=s.drives.find(d=>d.unit===k&&d.no===last.driveNo);if(dr)dr.result=null;u.driveNo=last.driveNo}
  u.sit={q:last.q,down:last.down,dist:last.dist,ytg:last.ytg};save();render();toast('마지막 스냅을 취소했습니다')});
}

 openModal({title:`${U.name} 드라이브 #${u.driveNo} 종료`,body:`${sug?`<div class="note warn" style="margin-bottom:12px">자동 감지: <b>${sug}</b> — 맞으면 그대로 종료하세요.</div>`:''}<p class="sm muted">${ds.length}스냅 · 합계 ${ds.filter(x=>!x.noPlay).reduce((t,x)=>t+x.yards,0)}야드</p><div class=lbl>종료 사유</div><div class=chips>${U.ends.map(e=>`<button class="chip sm ${sug===e?'on':''}" data-act=endPick data-v="${e}">${e}</button>`).join('')}</div>`,
  actions:[{label:sug?'아직 진행 중':'취소'},{label:'드라이브 종료',cls:'pri',fn:()=>{

   setTimeout(()=>{render();toast(`드라이브 종료 · ${dr.result} · 다음은 #${u.driveNo}`)},0)}}]});

function applyBoard(){
 const s=cur(),k=UI.unit,u=s.units[k],d=UI.board.draft;
 const Fo=FORMS[k][u.formation],Fn=FORMS[k][d.formation],ch=[];
 if(u.formation!==d.formation)ch.push(`포메이션 ${Fo.name} → ${Fn.name}`);
 if(u.coverage!==d.coverage)ch.push(`${UNITS[k].coverLbl} ${u.coverage} → ${d.coverage}`);
 if(u.strong!==d.strong)ch.push(`스트롱 ${u.strong} → ${d.strong}`);
 d.lineup.forEach((id,i)=>{if(u.lineup[i]!==id)ch.push(`${Fn.L[i]}: ${pname(u.lineup[i])} → ${pname(id)}`)});
 if(u.formation===d.formation&&JSON.stringify(u.slots)!==JSON.stringify(d.slots))ch.push('위치 조정');
 if(JSON.stringify(u.strokes)!==JSON.stringify(d.strokes))ch.push('필기 변경');
 Object.assign(u,clone(d));
 u.history.unshift({ts:Date.now(),txt:ch.join(' · ')||'변경 없음'});
 if(!s.snaps.some(x=>x.unit===k))u.starting=pickBoard(u);
 UI.board.undo=[];save();render();toast('배치 적용 — 다음 스냅부터 반영됩니다');
}

render();
</script>
